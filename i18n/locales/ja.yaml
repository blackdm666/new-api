tts.voice_required: "voice がありません。Kore などの Gemini プリセット音声を指定してください。利用可能な音声：{{.Voices}}"
tts.voice_unsupported: "{{.Model}} は音声「{{.Voice}}」に対応していません。alloy や nova など OpenAI の音声名は使えません。利用可能な音声：{{.Voices}}"
tts.speed_out_of_range: "speed は 0.25～4 の範囲で指定してください（現在 {{.Speed}}）。"
tts.stream_unsupported: "{{.Model}} はストリーミング出力に対応していません。stream または stream_format=sse を外してください。音声は一度にまとめて返されます。"
tts.chat_endpoint_unsupported: "{{.Model}} は音声合成モデルのため、チャット API では呼び出せません。POST /v1/audio/speech（OpenAI 互換）を使ってください。"
stt.chat_endpoint_unsupported: "{{.Model}} は音声認識モデルのため、チャット API では呼び出せません。POST /v1/audio/transcriptions（OpenAI 互換）を使ってください。"
realtime.endpoint_unsupported: "{{.Model}} はリアルタイム音声モデルのため、WebSocket エンドポイント /v1/realtime からのみ利用できます。"
tts.no_audio: "モデルが音声を返しませんでした（finishReason={{.Reason}}）。通常は一時的なものなので再試行してください。繰り返し発生する場合は、テキストが短すぎないか、記号だけになっていないか確認してください。"
stt.translation_unsupported: "{{.Model}} は /v1/audio/translations（英語への翻訳）に対応していません。元の言語のまま文字起こしするには POST /v1/audio/transcriptions を使ってください。"
stt.response_format_unsupported: "{{.Model}} は response_format「{{.Format}}」に対応していません。json、text、verbose_json から選んでください（省略時は json）。srt、vtt 字幕形式には対応していません。"
stt.stream_unsupported: "{{.Model}} はストリーミング文字起こしに対応していません。stream パラメーターを外してください。結果はまとめて返されます。"
stt.file_required: "file がありません。音声ファイルを multipart/form-data の file フィールドでアップロードしてください。"
stt.file_too_large: "音声ファイルは {{.Size}} MB で、上限の {{.Limit}} MB を超えています。圧縮する（例：16 kHz モノラル mp3 に変換）か、分割してから文字起こししてください。"
stt.file_format_unsupported: "アップロードされた音声の形式を認識できません。対応形式：mp3、wav、ogg/opus、flac、m4a/mp4、aac、webm、aiff"

# Relay errors: token group without the model, balance and token quota
distributor.model_not_in_group: "トークングループ「{{.Group}}」ではモデル「{{.Model}}」を利用できません。モデル名を確認するか、コンソールの「APIキー」ページでこのトークンを編集し、このモデルを含むグループに変更してください。"
distributor.model_not_in_group_suggest: "トークングループ「{{.Group}}」ではモデル「{{.Model}}」を利用できません。コンソールの「APIキー」ページでこのトークンを編集し、このモデルを含むグループに変更してください：{{.Groups}}。"
distributor.video_model_wrong_endpoint: "{{.Model}} は動画生成モデルのため、チャット・Responses・Messages・画像生成 API では呼び出せません。POST /v1/videos で動画タスクを送信し、GET /v1/videos/{task_id} で結果を取得してください。説明：https://88api.ai/en/docs/api/video/video-api-standard/"
distributor.image_model_wrong_endpoint: "{{.Model}} は画像生成モデルのため、{{.Path}} には対応していません。次のエンドポイントを使用してください：{{.Endpoints}}"
distributor.images_endpoint_not_supported: "{{.Model}} は OpenAI 画像エンドポイント {{.Path}} に対応していません。次のエンドポイントを使用してください：{{.Endpoints}}"
quota.user_insufficient: "残高不足：現在の残高は {{.Remaining}} です。チャージしてから再度お試しください。"
quota.pre_consume_insufficient: "残高不足：現在の残高は {{.Remaining}} で、今回のリクエストには {{.Required}} の確保が必要です（リクエストのパラメーターからの見積もりです。完了後は実際の使用量で精算し、差額は返金または追加請求されます）。チャージしてから再度お試しください。"
quota.token_insufficient: "トークンのクォータ不足：このトークンの残りは {{.Remaining}} で、今回のリクエストには {{.Required}} の確保が必要です。コンソールの「APIキー」ページで、このトークンのクォータを増やすか無制限のクォータに変更してください。"
