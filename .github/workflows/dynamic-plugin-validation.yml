name: Dynamic task plugin validation
on:
  push:
    branches: [Newapi-88API]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_DATABASE: plugin_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost -pfixture-only" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: plugin_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: root:fixture-only@tcp(127.0.0.1:3306)/plugin_test?charset=utf8mb4&parseTime=True&loc=Local
      TEST_POSTGRES_DSN: postgres://postgres:fixture-only@127.0.0.1:5432/plugin_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: mkdir -p web/dist && touch web/dist/index.html
      # The CI workflow runs the full backend suite independently.
      - name: Plugin routing and HTTP retry regression
        run: env -u TEST_MYSQL_DSN -u TEST_POSTGRES_DSN go test ./pkg/jsplugin ./plugins ./model ./middleware ./controller ./relay ./relay/channel/task/jsplugin -run 'Dynamic|XinMeng|DMC|Builtin|TaskPlugin|TaskCandidate' -count=1 -timeout 10m
      - name: Dynamic routing and pricing on MySQL and PostgreSQL
        run: go test ./model -run TestDynamicPluginDatabaseMatrix -count=1 -v
      - name: Wallet settlement on MySQL and PostgreSQL
        run: |
          TEST_TASK_DB_DIALECT=mysql go test ./controller -run TestImmediateTaskSettlementDatabase -count=1 -v
          TEST_TASK_DB_DIALECT=postgres go test ./controller -run TestImmediateTaskSettlementDatabase -count=1 -v
